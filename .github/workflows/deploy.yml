# Same as the workflow `jupyter book init --gh-pages` generates.
# In the repository's Settings > Pages, set the source to "GitHub Actions".
name: Jupyter Book GitHub Pages Deploy
on:
  push:
    branches: [main]
env:
  # The site is served at https://<user>.github.io/<repository name>
  BASE_URL: /${{ github.event.repository.name }}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@2.1.7
      - name: Build HTML Assets
        run: jupyter-book build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
